{% extends "base.html" %}

{% block title %}Nueva No Conformidad{% endblock %}

{% block content %}
<div class="container">
    <h1 class="mb-4">Registrar Nueva No Conformidad</h1>

    <div class="card">
        <div class="card-body">
            <form method="POST" action="{{ url_for('main.nueva_nc') }}">
                <div class="row">
                    <!-- Información básica -->
                    <div class="col-md-6">
                        <h5 class="mb-3">Información Básica</h5>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción de la NC *</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="4" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="area_afectada" class="form-label">Área Afectada *</label>
                            <input type="text" class="form-control" id="area_afectada" name="area_afectada"
                                   list="areas_list" required>
                            <datalist id="areas_list">
                                {% for area in areas %}
                                    <option value="{{ area }}">
                                {% endfor %}
                                <option value="Microbiología">
                                <option value="Química">
                                <option value="Fisicoquímica">
                                <option value="Calidad">
                                <option value="Administrativa">
                            </datalist>
                        </div>

                        <div class="mb-3">
                            <label for="tipo_nc" class="form-label">Tipo de NC *</label>
                            <select class="form-select" id="tipo_nc" name="tipo_nc" required>
                                <option value="">Seleccione...</option>
                                <option value="Mayor">Mayor</option>
                                <option value="Menor">Menor</option>
                                <option value="Observación">Observación</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="severidad" class="form-label">Severidad *</label>
                            <select class="form-select" id="severidad" name="severidad" required>
                                <option value="">Seleccione...</option>
                                <option value="Alta">Alta</option>
                                <option value="Media">Media</option>
                                <option value="Baja">Baja</option>
                            </select>
                        </div>
                    </div>

                    <!-- Responsable y acciones -->
                    <div class="col-md-6">
                        <h5 class="mb-3">Responsable y Acciones</h5>

                        <div class="mb-3">
                            <label for="responsable" class="form-label">Responsable</label>
                            <input type="text" class="form-control" id="responsable" name="responsable">
                        </div>

                        <div class="mb-3">
                            <label for="accion_inmediata" class="form-label">Acción Inmediata</label>
                            <textarea class="form-control" id="accion_inmediata" name="accion_inmediata" rows="4"></textarea>
                            <small class="form-text text-muted">Acción tomada de forma inmediata para contener el problema</small>
                        </div>

                        <div class="mb-3">
                            <label for="observaciones" class="form-label">Observaciones</label>
                            <textarea class="form-control" id="observaciones" name="observaciones" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="creado_por" class="form-label">Registrado por *</label>
                            <input type="text" class="form-control" id="creado_por" name="creado_por" required>
                        </div>
                    </div>
                </div>

                <hr>

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('main.listar_nc') }}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Registrar NC
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
